<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuddyAI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.134 2 5 5.134 5 9c0 4.5 3 9 7 13 4-4 7-8.5 7-13 0-3.866-3.134-7-7-7Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M9.4 10.1c.6-1 1.6-1.6 2.6-1.6 1.2 0 2.2.8 2.6 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M9.6 14.2c.8 1.1 1.8 1.7 2.7 1.7.9 0 1.9-.6 2.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>BuddyAI</h1>
        </div>
      </div>
    </header>

    <div id="chat-box" class="chat-box" aria-live="polite"></div>

    <div class="input-area">
      <div class="input-wrap">
        <span class="input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <input type="text" id="user-input" placeholder="Message AI..." autocomplete="off" />
      </div>

      <button id="send-btn" type="button" aria-label="Send message">
        <span class="send-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 2 11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M22 2 15 22l-4-9-9-4 20-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
